name: validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run numerical tests
        run: Rscript numerics/tests/testthat.R

      - name: Validate archived outputs, data provenance, and repository structure
        run: Rscript tools/validate_repository.R
